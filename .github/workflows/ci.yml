name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      # Unit suite gates every run — pure, no infra (Vitest `unit` project).
      # The integration suite needs a live Supabase local stack and is run
      # ad-hoc/locally rather than in CI (see test-plan §4). Those tests self-skip
      # when SUPABASE_SERVICE_ROLE_KEY is absent, so they would no-op here anyway —
      # a unit-only gate keeps that explicit.
      - run: npm run test:unit
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
      - name: Link and Push database migrations
        if: github.event_name == 'push'
        run: |
          npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password "${{ secrets.SUPABASE_DBPWD }}"
          npx supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}